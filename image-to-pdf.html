<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>if(!("PageRevealEvent" in window))document.documentElement.classList.add("pg-fb")</script>
<title>Image to PDF — Breaking Docs</title>
<meta name="description" content="Turn any picture into a clean PDF. Done in your browser. Pure and private.">
<meta property="og:image" content="assets/og-image.jpg"><link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/grade.css"><link rel="stylesheet" href="css/scenes.css"><link rel="stylesheet" href="css/motion.css"><link rel="stylesheet" href="css/site-life.css">
<script type="module" src="js/ui.js"></script><script defer src="js/site-life.js"></script>
<script type="module">import {init} from './js/tools/image-to-pdf.js';init();</script></head>
<body>
<div id="topbar"></div>
<main>
<section class="tool" id="tool" data-stage="idle" data-scene="pilot" data-state="idle">
 <div class="tool-shade"></div>
 <div class="tool-char" data-char="jesse"></div>
 <div class="wrap tool-body">

  <header class="tool-title">
   <div class="tile tool-tile" id="title-tile" aria-hidden="true"></div>
   <div><h1 data-copy="tools.Im.name"></h1><p class="tool-promise" data-copy="tools.Im.promise"></p></div>
  </header>

  <ol class="stepper" aria-label="" data-copy-aria="stepper.aria">
   <li class="step"><span class="step-tile" aria-hidden="true"><b>1</b><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></span><span class="step-l mono" data-copy="stepper.drop"></span></li>
   <li class="step"><span class="step-tile" aria-hidden="true"><b>2</b><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></span><span class="step-l mono" data-copy="stepper.cook"></span></li>
   <li class="step"><span class="step-tile" aria-hidden="true"><b>3</b><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></span><span class="step-l mono" data-copy="stepper.download"></span></li>
  </ol>

  <div data-show="idle filesChosen">
   <div class="tray" id="tray">
    <div class="tray-in">
     <span class="tray-barrel" id="dz-barrel" aria-hidden="true"></span>
     <button type="button" class="dz-hit" id="dz-hit" aria-describedby="dz-types dz-max">
      <span class="dz-flask" id="dz-flask" aria-hidden="true"></span>
      <span class="dz-title" id="dz-label" data-copy="dropzone.idle"></span>
      <span class="dz-sub" data-copy="dropzone.sub"></span>
      <span class="dz-types mono" id="dz-types"></span>
      <span class="dz-types mono" id="dz-max"></span>
     </button>
     <ul class="thumbs" id="thumbs" aria-labelledby="thumbs-label"></ul>
     <p class="busy mono" id="busy" hidden aria-hidden="true"></p>
    </div>
    <span class="sr-only" id="thumbs-label" data-copy="grid.list"></span>
   </div>
     <ul class="trust mono">
    <li><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5.5 2v4.2c0 3.1-2.3 5.6-5.5 6.8-3.2-1.2-5.5-3.7-5.5-6.8V3.5z"/></svg><span data-copy="trust.none"></span></li>
    <li><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 2.5h6l7 7-5 5-7-7z"/><circle cx="5" cy="6" r="1"/></svg><span data-copy="trust.signup"></span></li>
    <li><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M1.5 6h13"/></svg><span data-copy="trust.browser"></span></li>
   </ul>
  </div>

  <div class="msgs" id="msgs" aria-live="polite"></div>
  <p class="sr-only" id="sr-live" aria-live="polite"></p>

  <section class="sheet" data-show="filesChosen" aria-labelledby="sheet-h">
   <h2 id="sheet-h" class="sheet-h mono" data-copy="opts.title"></h2>
   <div class="sheet-grid">
    <fieldset class="optgroup"><legend class="mono" data-copy="opts.size"></legend><div class="seg">
     <label><input type="radio" name="size" value="fit" checked><span data-copy="opts.sizeFit"></span></label>
     <label><input type="radio" name="size" value="a4"><span data-copy="opts.sizeA4"></span></label>
     <label><input type="radio" name="size" value="letter"><span data-copy="opts.sizeLetter"></span></label></div></fieldset>
    <fieldset class="optgroup" data-fixed-only><legend class="mono" data-copy="opts.orient"></legend><div class="seg">
     <label><input type="radio" name="orient" value="auto" checked><span data-copy="opts.oAuto"></span></label>
     <label><input type="radio" name="orient" value="portrait"><span data-copy="opts.oPortrait"></span></label>
     <label><input type="radio" name="orient" value="landscape"><span data-copy="opts.oLandscape"></span></label></div></fieldset>
    <fieldset class="optgroup"><legend class="mono" data-copy="opts.margin"></legend><div class="seg">
     <label><input type="radio" name="margin" value="none" checked><span data-copy="opts.mNone"></span></label>
     <label><input type="radio" name="margin" value="small"><span data-copy="opts.mSmall"></span></label>
     <label><input type="radio" name="margin" value="big"><span data-copy="opts.mBig"></span></label></div></fieldset>
    <fieldset class="optgroup" data-fixed-only><legend class="mono" data-copy="opts.fit"></legend><div class="seg">
     <label><input type="radio" name="fit" value="contain" checked><span data-copy="opts.fContain"></span></label>
     <label><input type="radio" name="fit" value="cover"><span data-copy="opts.fCover"></span></label></div></fieldset>
   </div>
  </section>

  <div class="go-row" data-show="idle filesChosen"><button type="button" class="btn go" id="go" disabled><span></span><span class="go-hint" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 016 0v2"/></svg><span data-copy="go.hint"></span></span></button></div>

  <section class="progress-panel" id="progress" data-show="processing" hidden></section>

  <section class="result" id="result" data-show="done" hidden aria-live="polite"></section>

  <section class="errpanel" data-show="error" hidden aria-live="polite">
   <div class="err-char" id="err-char" aria-hidden="true"></div>
   <div class="err-body">
    <span class="err-prop" id="err-prop" aria-hidden="true"></span>
    <h2 id="err-msg" tabindex="-1"></h2><div id="err-extra"></div>
    <div class="res-actions">
     <button type="button" class="btn btn-sm" id="err-retry" data-copy="errors.retry"></button>
     <button type="button" class="btn btn-danger btn-sm" id="err-again" data-copy="result.again"></button>
    </div>
   </div>
  </section>

 </div>
 <div class="tape tool-tape"></div>
</section>

<section class="tools more" data-scene="night"><div class="wrap">
 <h2 data-copy="home.gridHeading"></h2>
 <div class="grid" data-tiles='{"live":true,"exclude":"Im"}'></div>
</div></section>
</main>
<footer id="footer"></footer>
</body></html>
